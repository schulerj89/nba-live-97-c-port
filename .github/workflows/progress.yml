name: Progress metadata

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test count-only milestone reporting
        run: python -m unittest discover -s tools -p test_report_progress.py
      - name: Verify generated progress reports
        run: python tools/report_progress.py --check
      - name: Verify recovered C ownership
        run: python tools/verify_recovery.py
      - name: Verify instruction-semantic accounting
        run: python tools/verify_instruction_semantics.py --check
      - name: Verify View Rosters scenario contract
        run: python tools/verify_roster_scenarios.py --check-config
      - name: Verify Re-order ledger regression tests
        run: python -m unittest discover -s tools -p test_reorder_progress.py
      - name: Verify narrow Trade entry ledger regression tests
        run: python -m unittest discover -s tools -p test_trade_progress.py
      - name: Verify Sign ledger regression tests
        run: python -m unittest discover -s tools -p test_sign_free_agent.py
      - name: Verify Release accounting and private extraction with synthetic fixtures
        run: python -m unittest discover -s tools -p 'test_release_*.py'
      - name: Verify reference comparator with synthetic media only
        run: |
          python -m pip install Pillow==10.4.0
          python -m unittest discover -s tools -p test_sign_screen.py
          python -m unittest discover -s tools -p test_reorder_reference.py
          python -m unittest discover -s tools -p test_inspect_native_frames.py
          python -m unittest discover -s tools -p test_inspect_help_events.py
          python -m unittest discover -s tools -p test_inspect_process_audio.py
          python -m unittest discover -s tools -p test_trade_screen.py
          python -m unittest discover -s tools -p test_trade_recording.py
          python tools/verify_reorder_reference.py --check-config
      - name: Verify private Help extraction with synthetic fixtures
        run: python -m unittest discover -s tools -p test_frontend_help.py
      - name: Verify private Trade extraction with synthetic fixtures
        run: python -m unittest discover -s tools -p test_trade_assets.py
      - name: Verify private Compare extraction with synthetic fixtures
        run: python -m unittest discover -s tools -p test_compare_assets.py
      - name: Verify small portrait CLUT transparency without game assets
        run: python -m unittest discover -s tools -p test_reorder_portraits.py
      - name: Verify private indexed palette packing without game assets
        run: python -m unittest discover -s tools -p test_team_backgrounds.py
      - name: Build asset-free Re-order core tests
        run: |
          cmake -S . -B build-core -DNBA97_RECOVERED_TESTS_ONLY=ON
          cmake --build build-core
      - name: Run all asset-free native regression tests
        run: ctest --test-dir build-core --output-on-failure
      - name: Verify Sign instruction accounting and native scenarios
        run: python tools/verify_sign_free_agent.py --check --native-test build-core/nba97_sign_tests
      - name: Verify bounded Release accounting and native scenarios
        run: python tools/verify_release_players.py --check --native-test build-core/nba97_release_tests
      - name: Verify Help modal and parent round trips
        run: ./build-core/nba97_frontend_help_tests
      - name: Verify Trade entry accounting and native scenarios
        run: python tools/verify_trade_rosters.py --check --native-test build-core/nba97_trade_tests
      - name: Verify Trade controller and bounded private pack parser
        run: |
          ./build-core/nba97_trade_screen_tests
          ./build-core/nba97_trade_assets_tests
      - name: Verify passive native recording bounds and failure reporting
        run: ./build-core/nba97_native_frame_capture_tests
      - name: Verify independent music PCM gain and loop continuity
        run: ./build-core/nba97_music_pcm_tests
      - name: Verify source palette arithmetic and indexed rendering
        run: |
          ./build-core/nba97_frontend_palette_tests
          ./build-core/nba97_frontend_palette_assets_tests
      - name: Verify isolated draft and child round trips
        run: ./build-core/nba97_reorder_child_tests
      - name: Verify Compare controller without original assets
        run: ./build-core/nba97_roster_compare_tests
      - name: Verify bounded Compare pack parsing and field formatting
        run: ./build-core/nba97_compare_assets_tests
      - name: Verify compact roster save format and malformed inputs
        run: ./build-core/nba97_roster_save_tests
      - name: Verify canonical roster identity and allocation-safe preparation
        run: ./build-core/nba97_roster_database_save_tests
      - name: Verify roster disk transactions in isolated fixture directories
        run: ./build-core/nba97_roster_save_store_tests
      - name: Verify Reset eligibility and confirmation lifecycle
        run: ./build-core/nba97_roster_reset_tests
      - name: Verify Reset extractor with synthetic descriptors
        run: python -m unittest discover -s tools -p test_roster_reset.py
      - name: Verify Player warning modal and private-data extractor without assets
        run: |
          ./build-core/nba97_player_notice_tests
          python -m unittest discover -s tools -p test_player_notice.py
      - name: Verify Re-order ledger and fresh core scenarios
        run: python tools/verify_reorder_rosters.py --check --native-test build-core/nba97_reorder_tests
      - name: Verify Cool Fact selection and eight-present feedback lifecycle
        run: ./build-core/nba97_cool_fact_selection_tests
      - name: Verify frame-step observation inspector using synthetic images only
        run: python -m unittest discover -s tools -p test_inspect_title_frame_steps.py
      - name: Ensure private asset directory is not tracked
        shell: bash
        run: |
          if git ls-files | grep -q '^\.local/'; then
            echo '.local must never contain tracked files'
            exit 1
          fi
