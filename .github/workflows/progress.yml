name: Progress metadata

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test count-only milestone reporting
        run: python -m unittest discover -s tools -p test_report_progress.py
      - name: Verify generated progress reports
        run: python tools/report_progress.py --check
      - name: Verify recovered C ownership
        run: python tools/verify_recovery.py
      - name: Verify instruction-semantic accounting
        run: python tools/verify_instruction_semantics.py --check
      - name: Verify View Rosters scenario contract
        run: python tools/verify_roster_scenarios.py --check-config
      - name: Verify Re-order ledger regression tests
        run: python -m unittest discover -s tools -p test_reorder_progress.py
      - name: Build asset-free Re-order core tests
        run: |
          cmake -S . -B build-core -DNBA97_RECOVERED_TESTS_ONLY=ON
          cmake --build build-core
      - name: Verify Re-order ledger and fresh core scenarios
        run: python tools/verify_reorder_rosters.py --check --native-test build-core/nba97_reorder_tests
      - name: Ensure private asset directory is not tracked
        shell: bash
        run: |
          if git ls-files | grep -q '^\.local/'; then
            echo '.local must never contain tracked files'
            exit 1
          fi
