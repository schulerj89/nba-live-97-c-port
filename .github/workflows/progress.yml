name: Progress metadata

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated progress reports
        run: python tools/report_progress.py --check
      - name: Verify recovered C ownership
        run: python tools/verify_recovery.py
      - name: Verify instruction-semantic accounting
        run: python tools/verify_instruction_semantics.py --check
      - name: Ensure private asset directory is not tracked
        shell: bash
        run: |
          if git ls-files | grep -q '^\.local/'; then
            echo '.local must never contain tracked files'
            exit 1
          fi
